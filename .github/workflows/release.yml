name: Testar e publicar

# Um workflow só. A cada push na main:
#   1. testes (com Postgres)
#   2. release v<major>.<minor>.<n> com a imagem Docker (amd64 + arm64) e o instalador
#   3. site no GitHub Pages (só se o Pages estiver ligado; se não estiver, não quebra nada)
# Em pull requests roda só os testes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: bubu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/bubu

  release:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "tag=v${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUBU_VERSAO=${{ steps.v.outputs.tag }}
          tags: |
            ghcr.io/dhqdev/bubu:${{ steps.v.outputs.tag }}
            ghcr.io/dhqdev/bubu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          {
            echo "## Instalar / atualizar na VPS"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash"
            echo '```'
            echo
            echo "Imagem: \`ghcr.io/dhqdev/bubu:${TAG}\` (amd64 e arm64)"
          } > notas.md
          gh release create "$TAG" deploy/install.sh deploy/bubu-stack.yml deploy/traefik-stack.yml \
            --target "$GITHUB_SHA" --title "Bubu $TAG" --notes-file notas.md --generate-notes --latest

  # Publica o app no GitHub Pages só se o Pages estiver ligado
  # (Settings → Pages → Source: GitHub Actions). Desligado = o job passa sem fazer nada.
  pages:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pages está ligado?
        id: ligado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages desligado: ligue em Settings → Pages → Source: GitHub Actions para publicar o site."
          fi
      - uses: actions/checkout@v4
        if: steps.ligado.outputs.sim == 'true'
      - name: Montar a pasta do site
        if: steps.ligado.outputs.sim == 'true'
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - uses: actions/configure-pages@v5
        if: steps.ligado.outputs.sim == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ligado.outputs.sim == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.ligado.outputs.sim == 'true'
