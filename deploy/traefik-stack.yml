# Traefik para Docker Swarm. O instalador só sobe esta stack se ainda não houver um Traefik rodando.
#   TRAEFIK_EMAIL  e-mail para os certificados do Let's Encrypt
version: "3.7"

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=network_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencryptresolver.acme.email=${TRAEFIK_EMAIL}"
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/etc/traefik/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificados:/etc/traefik/letsencrypt
    networks:
      - network_public
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager

volumes:
  traefik_certificados:
    name: traefik_certificados

networks:
  network_public:
    external: true
    name: network_public
