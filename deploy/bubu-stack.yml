# Stack do Bubu para Docker Swarm + Traefik (rede network_public).
# Use com o instalador (deploy/install.sh), que preenche as variáveis abaixo a partir de /opt/bubu/.env:
#   BUBU_IMAGEM        imagem do app (ex.: ghcr.io/dhqdev/bubu:v0.2.5 ou bubu:local)
#   BUBU_DOMINIO       domínio público (ex.: bubu.seudominio.com)
#   BUBU_DB_SENHA      senha do Postgres do Bubu (gerada pelo instalador; não troque depois)
#   BUBU_CERTRESOLVER  nome do certresolver do Traefik (padrão: letsencryptresolver)
version: "3.7"

services:
  app:
    image: ${BUBU_IMAGEM}
    environment:
      - PORT=3000
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgres://bubu:${BUBU_DB_SENHA}@postgres:5432/bubu
    networks:
      - network_public
      - bubu_interno
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.bubu.rule=Host(`${BUBU_DOMINIO}`)"
        - "traefik.http.routers.bubu.entrypoints=websecure"
        - "traefik.http.routers.bubu.tls.certresolver=${BUBU_CERTRESOLVER}"
        - "traefik.http.routers.bubu.service=bubu-service"
        - "traefik.http.services.bubu-service.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.bubu-http.rule=Host(`${BUBU_DOMINIO}`)"
        - "traefik.http.routers.bubu-http.entrypoints=web"
        - "traefik.http.routers.bubu-http.middlewares=bubu-https"
        - "traefik.http.middlewares.bubu-https.redirectscheme.scheme=https"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bubu
      - POSTGRES_PASSWORD=${BUBU_DB_SENHA}
      - POSTGRES_DB=bubu
      - TZ=America/Sao_Paulo
    volumes:
      - bubu_db:/var/lib/postgresql/data
    networks:
      - bubu_interno
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  bubu_db:
    name: bubu_db

networks:
  network_public:
    external: true
    name: network_public
  bubu_interno:
    driver: overlay
